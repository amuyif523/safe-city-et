[project]
name = "safe-city-backend"
version = "0.1.0"
description = "Safe City ET command center backend built with FastAPI + SQLAlchemy."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.3",
    "email-validator>=2.1.1",
]

[tool.uvicorn]
factory = false
reload = true
host = "0.0.0.0"
port = 8000
app = "app.main:app"
